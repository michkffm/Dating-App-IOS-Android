services:
  - type: web
    name: heartpulse
    runtime: docker
    plan: free
    region: frankfurt
    autoDeployTrigger: "off"
    healthCheckPath: /healthz
    envVars:
      - key: REGISTRATION_ENABLED
        value: "false"
      - key: ACCOUNT_MAIL_DAILY_LIMIT
        value: "100"
      - key: DATABASE_URL
        sync: false
      - key: APP_ORIGINS
        sync: false
      - key: PUBLIC_APP_ORIGIN
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: BREVO_API_KEY
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
