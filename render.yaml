services:
  - type: web
    name: heartpulse
    runtime: docker
    plan: free
    region: frankfurt
    autoDeployTrigger: "off"
    healthCheckPath: /healthz
    envVars:
      - key: REGISTRATION_ENABLED
        value: "false"
      - key: ACCOUNT_MAIL_DAILY_LIMIT
        value: "100"
      - key: DATABASE_URL
        sync: false
